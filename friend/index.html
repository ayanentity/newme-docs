<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>newme に招待されました</title>
<!--
  newme の友達の招待リンク(https://newme.ayanentity.com/friend/#<データ>)の案内ページ。
  アプリが入っていればユニバーサルリンクでアプリが開くので、このページが出るのはアプリがない(またはリンクが効かない)ときだけ。

  - 招待のデータ(鍵共有の公開鍵・受付箱の合言葉・ニックネーム)はフラグメント(# 以降)にあり、サーバーには送られない。
    このページもデータをどこにも送らない。解析タグ・外部のスクリプト・フォント・画像は置かないこと
  - 招待した人の名前は、このページの中でフラグメントから読んで表示するだけ
  - 「アプリで開く」は、同じデータでカスタムスキーム(com.ayanentity.newme://friend#...)を開く。
    LINE などの内蔵ブラウザでユニバーサルリンクが効かないときの逃げ道
  - データの形式はアプリの Entity/CommunityInvite.swift と揃える(形式 3)
-->
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="apple-itunes-app" content="app-id=6824103202">
<style>
  :root {
    --bg: #f6f7f6;
    --card: #ffffff;
    --text: #1c1c1e;
    --sub: #6e6e73;
    --accent: #5cd4c2;
    --accent-text: #0b2b26;
    --border: rgba(0, 0, 0, 0.08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --card: #1c1c1e;
      --text: #f2f2f7;
      --sub: #a1a1a6;
      --border: rgba(255, 255, 255, 0.12);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }
  main {
    width: 100%;
    max-width: 400px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 32px 24px;
    text-align: center;
  }
  h1 { font-size: 22px; margin: 0 0 8px; line-height: 1.4; }
  p { color: var(--sub); font-size: 15px; line-height: 1.6; margin: 0 0 16px; }
  .button {
    display: block;
    width: 100%;
    padding: 14px;
    border-radius: 14px;
    font-size: 17px;
    font-weight: 600;
    text-decoration: none;
    margin-top: 12px;
  }
  .primary { background: var(--accent); color: var(--accent-text); }
  .secondary { color: var(--accent); border: 1px solid var(--border); }
  ol { text-align: left; color: var(--sub); font-size: 14px; line-height: 1.7; padding-left: 20px; margin: 24px 0 0; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1 id="title">newme で友達になろう</h1>
  <p id="lead">newme は、毎日の習慣を写真で残すアプリです。</p>

  <a class="button primary" href="https://apps.apple.com/app/id6824103202">App Store で入手</a>
  <a class="button secondary" id="open-app" href="#" hidden>アプリで開く</a>

  <ol id="steps" hidden>
    <li>App Store から newme を入れます</li>
    <li>入れたら、もう一度 QR コードを読み取るか、このリンクを開いてください</li>
    <li>友達の申請を送り、相手が承認すると友達になります</li>
  </ol>
  <p id="invalid" hidden style="margin-top: 24px;">リンクが途中で切れているようです。招待した人に、もう一度リンクを送ってもらってください。</p>
</main>
<script>
  (function () {
    var SCHEME = "com.ayanentity.newme://friend#";
    var VERSION = 3;
    var HEADER_LENGTH = 1 + 32 + 32; // 形式番号 + 鍵共有の公開鍵 + 受付箱の合言葉

    var data = location.hash.slice(1);
    var nickname = readNickname(data);

    if (nickname === null) {
      if (data) document.getElementById("invalid").hidden = false;
      return;
    }

    document.getElementById("title").textContent = nickname + " さんから newme の招待が届いています";
    document.getElementById("lead").textContent = "newme は、毎日の習慣を写真で残すアプリです。友達になると、お互いの記録が見えるようになります。";
    document.getElementById("steps").hidden = false;

    var openApp = document.getElementById("open-app");
    openApp.href = SCHEME + data;
    openApp.hidden = false;

    // 招待のデータからニックネームを読む。形式が違う・壊れているときは null
    function readNickname(text) {
      if (!text || !/^[A-Za-z0-9_-]+$/.test(text)) return null;
      try {
        var base64 = text.replace(/-/g, "+").replace(/_/g, "/");
        while (base64.length % 4) base64 += "=";
        var binary = atob(base64);
        if (binary.length <= HEADER_LENGTH || binary.charCodeAt(0) !== VERSION) return null;

        var bytes = new Uint8Array(binary.length - HEADER_LENGTH);
        for (var i = 0; i < bytes.length; i++) bytes[i] = binary.charCodeAt(HEADER_LENGTH + i);
        var name = new TextDecoder("utf-8", { fatal: true }).decode(bytes).trim();
        return name ? name : null;
      } catch (e) {
        return null;
      }
    }
  })();
</script>
</body>
</html>
